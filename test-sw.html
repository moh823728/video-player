<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Worker Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Service Worker Test Page</h1>
    
    <div id="status" class="status info">Checking Service Worker support...</div>
    
    <div>
        <button onclick="testRegistration()">Test Registration</button>
        <button onclick="testCache()">Test Cache</button>
        <button onclick="testCORSCaching()">Test CORS Caching</button>
        <button onclick="testBlobCaching()">Test Blob Caching</button>
        <button onclick="testRequestHeaders()">Test Request Headers</button>
        <button onclick="testCORSProxy()">Test CORS Proxy Fallback</button>
        <button onclick="testLocalStorage()">Test LocalStorage</button>
        <button onclick="clearCache()">Clear Cache</button>
        <button onclick="unregisterSW()">Unregister SW</button>
    </div>
    
    <div style="margin-top: 15px;">
        <button onclick="testAll()">Run All Tests</button>
    </div>
    
    <div id="logs"></div>

    <script>
        const CACHE_NAME = 'telegram-video-cache-v1';
        
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = `status ${type}`;
            logEntry.textContent = message;
            logsDiv.appendChild(logEntry);
        }

        function updateStatus(message, type = 'info') {
            document.getElementById('status').textContent = message;
            document.getElementById('status').className = `status ${type}`;
        }

        async function testRegistration() {
            if (!('serviceWorker' in navigator)) {
                updateStatus('Service Worker not supported', 'error');
                return;
            }

            try {
                log('Attempting to register Service Worker with relative path...', 'info');
                const registration = await navigator.serviceWorker.register('./sw.js', { scope: './' });
                log(`Service Worker registered successfully! Scope: ${registration.scope}`, 'success');
                updateStatus('Service Worker registered', 'success');
            } catch (error) {
                log(`Service Worker registration failed: ${error.message}`, 'error');
                updateStatus('Registration failed', 'error');
            }
        }

        async function testCache() {
            try {
                log('Testing cache operations...', 'info');
                const cache = await caches.open(CACHE_NAME);
                await cache.add('./index.html');
                log('Successfully cached index.html', 'success');
            } catch (error) {
                log(`Cache test failed: ${error.message}`, 'error');
            }
        }

        async function testCORSCaching() {
            try {
                const testUrl = 'https://api.telegram.org/file/bot8956265531:AAHFQKgAX7m8hnVqAYGFML19_MGUQMCmoZw/test';
                log('Testing CORS caching with manual fetch...', 'info');
                
                const cache = await caches.open(CACHE_NAME);
                
                // Manual fetch with CORS mode
                const response = await fetch(testUrl, { mode: 'cors' });
                
                if (!response.ok) {
                    log(`CORS fetch test completed (expected to fail for invalid URL): ${response.status}`, 'info');
                    return;
                }
                
                // Cache the response manually
                await cache.put(testUrl, response);
                log('Successfully tested CORS caching with manual fetch', 'success');
            } catch (error) {
                log(`CORS caching test: ${error.message} (this is expected for invalid URLs)`, 'info');
            }
        }

        async function testBlobCaching() {
            try {
                log('Testing Blob caching approach...', 'info');
                
                // Use a small test file (GitHub logo or similar)
                const testUrl = 'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png';
                
                const response = await fetch(testUrl);
                if (!response.ok) {
                    throw new Error(`Failed to fetch test image: ${response.status}`);
                }
                
                // Download as blob
                const blob = await response.blob();
                log(`Downloaded blob: ${blob.size} bytes, type: ${blob.type}`, 'info');
                
                // Create new Response with blob
                const cachedResponse = new Response(blob, {
                    headers: { 
                        'Content-Type': response.headers.get('Content-Type') || 'image/png',
                        'Content-Length': blob.size
                    }
                });
                
                // Cache the blob response
                const cache = await caches.open(CACHE_NAME);
                await cache.put(testUrl, cachedResponse);
                
                // Verify it can be retrieved
                const retrieved = await cache.match(testUrl);
                if (retrieved) {
                    log('Successfully cached and retrieved blob response', 'success');
                } else {
                    log('Failed to retrieve cached blob', 'error');
                }
            } catch (error) {
                log(`Blob caching test failed: ${error.message}`, 'error');
            }
        }

        async function testRequestHeaders() {
            try {
                log('Testing request headers for 503 bypass...', 'info');
                
                // Use a test endpoint that accepts various headers
                const testUrl = 'https://httpbin.org/headers';
                
                const response = await fetch(testUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'video/mp4,video/*;q=0.9,*/*;q=0.8'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch with headers: ${response.status}`);
                }
                
                const data = await response.json();
                log(`Request headers test successful. Server received headers:`, 'success');
                log(`Accept header: ${data.headers.Accept}`, 'info');
            } catch (error) {
                log(`Request headers test failed: ${error.message}`, 'error');
            }
        }

        async function testCORSProxy() {
            try {
                log('Testing CORS proxy fallback mechanism...', 'info');
                
                // Test with a URL that might have CORS issues
                const testUrl = 'https://api.telegram.org/file/bot8956265531:AAHFQKgAX7m8hnVqAYGFML19_MGUQMCmoZw/test';
                
                // First try direct fetch
                let response;
                let usedProxy = false;
                
                try {
                    log('Attempting direct fetch...', 'info');
                    response = await fetch(testUrl, {
                        method: 'GET',
                        headers: {
                            'Accept': 'video/mp4,video/*;q=0.9,*/*;q=0.8'
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error(`Direct fetch failed with status ${response.status}`);
                    }
                    
                    log('Direct fetch successful', 'success');
                } catch (directError) {
                    log(`Direct fetch failed: ${directError.message}, trying CORS proxy...`, 'info');
                    
                    // Fallback to CORS proxy
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(testUrl)}`;
                    log(`Fetching via CORS proxy: ${proxyUrl}`, 'info');
                    
                    response = await fetch(proxyUrl);
                    
                    if (!response.ok) {
                        throw new Error(`CORS proxy fetch failed with status ${response.status}`);
                    }
                    
                    usedProxy = true;
                    log('CORS proxy fetch successful', 'success');
                }
                
                const resultMessage = usedProxy 
                    ? 'CORS proxy fallback test successful' 
                    : 'Direct fetch test successful (no proxy needed)';
                log(resultMessage, 'success');
                
            } catch (error) {
                log(`CORS proxy test failed: ${error.message}`, 'error');
            }
        }

        function testLocalStorage() {
            try {
                log('Testing localStorage operations...', 'info');
                
                // Test storing and retrieving video metadata
                const testData = {
                    url: 'https://example.com/video.mp4',
                    title: 'Test Video',
                    date: new Date().toLocaleString()
                };
                
                localStorage.setItem('lastCachedVideoUrl', testData.url);
                localStorage.setItem('lastCachedVideoTitle', testData.title);
                localStorage.setItem('lastCachedVideoDate', testData.date);
                
                const retrievedUrl = localStorage.getItem('lastCachedVideoUrl');
                const retrievedTitle = localStorage.getItem('lastCachedVideoTitle');
                const retrievedDate = localStorage.getItem('lastCachedVideoDate');
                
                if (retrievedUrl === testData.url && retrievedTitle === testData.title) {
                    log('LocalStorage test successful - metadata stored and retrieved', 'success');
                    log(`Stored: ${testData.url}, ${testData.title}`, 'info');
                } else {
                    log('LocalStorage test failed - data mismatch', 'error');
                }
                
                // Cleanup
                localStorage.removeItem('lastCachedVideoUrl');
                localStorage.removeItem('lastCachedVideoTitle');
                localStorage.removeItem('lastCachedVideoDate');
                log('LocalStorage cleanup completed', 'info');
            } catch (error) {
                log(`LocalStorage test failed: ${error.message}`, 'error');
            }
        }

        async function clearCache() {
            try {
                log('Clearing cache...', 'info');
                await caches.delete(CACHE_NAME);
                
                // Clear localStorage entries
                localStorage.removeItem('lastCachedVideoUrl');
                localStorage.removeItem('lastCachedVideoTitle');
                localStorage.removeItem('lastCachedVideoDate');
                
                log('Cache and localStorage cleared successfully', 'success');
            } catch (error) {
                log(`Cache clear failed: ${error.message}`, 'error');
            }
        }

        async function unregisterSW() {
            try {
                log('Unregistering Service Worker...', 'info');
                const registration = await navigator.serviceWorker.getRegistration();
                if (registration) {
                    await registration.unregister();
                    log('Service Worker unregistered successfully', 'success');
                    updateStatus('Service Worker unregistered', 'info');
                } else {
                    log('No Service Worker found to unregister', 'info');
                }
            } catch (error) {
                log(`Unregister failed: ${error.message}`, 'error');
            }
        }

        async function testAll() {
            log('Running all tests...', 'info');
            
            await testRegistration();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await testCache();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await testCORSCaching();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await testBlobCaching();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await testRequestHeaders();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await testCORSProxy();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            testLocalStorage();
            
            log('All tests completed', 'success');
        }

        // Check SW support on load
        window.addEventListener('load', () => {
            if ('serviceWorker' in navigator) {
                updateStatus('Service Worker is supported', 'success');
                log('Service Worker API is available', 'success');
            } else {
                updateStatus('Service Worker not supported', 'error');
                log('Service Worker API is not available in this browser', 'error');
            }
        });
    </script>
</body>
</html>
