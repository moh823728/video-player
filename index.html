<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="description" content="Offline Video Player for Telegram Channel">
    <title>Telegram Video Player</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: #2a2a2a;
            border-radius: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-dot.online {
            background: #44ff44;
        }

        .status-dot.cached {
            background: #44aaff;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .video-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            aspect-ratio: 16 / 9;
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .info {
            text-align: center;
            margin-bottom: 20px;
        }

        .info h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .info p {
            color: #888;
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            background: #3a3a3a;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background: #4a4a4a;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.primary {
            background: #0088cc;
        }

        button.primary:hover {
            background: #0099dd;
        }

        .error {
            background: #3a1a1a;
            color: #ff6666;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #3a3a3a;
            border-top-color: #0088cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .info h1 {
                font-size: 20px;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Checking connection...</span>
        </div>

        <div class="video-container">
            <video id="videoPlayer" controls playsinline>
                <p>Your browser doesn't support HTML5 video.</p>
            </video>
        </div>

        <div class="info">
            <h1 id="videoTitle">No video loaded</h1>
            <p id="videoDate">-</p>
        </div>

        <div class="controls">
            <button class="primary" id="loadBtn">Load Latest Video</button>
            <button id="cacheBtn">Cache Video</button>
            <button id="clearCacheBtn">Clear Cache</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading video...</p>
        </div>

        <div class="error" id="error"></div>
    </div>

    <script>
        // ========================================
        // CONFIGURATION - EDIT THESE VALUES
        // ========================================
        const CONFIG = {
            // Your Telegram Bot Token from BotFather
            BOT_TOKEN: '8956265531:AAHFQKgAX7m8hnVqAYGFML19_MGUQMCmoZw',
            
            // Your Private Channel ID (format: -100XXXXXXXXXX)
            CHANNEL_ID: '-1004498225842',
            
            // Cache name for offline storage
            CACHE_NAME: 'telegram-video-cache-v1'
        };

        // ========================================
        // STATE MANAGEMENT
        // ========================================
        let currentVideoUrl = null;
        let currentVideoTitle = null;
        let currentVideoDate = null;

        // ========================================
        // DOM ELEMENTS
        // ========================================
        const videoPlayer = document.getElementById('videoPlayer');
        const videoTitle = document.getElementById('videoTitle');
        const videoDate = document.getElementById('videoDate');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const loadBtn = document.getElementById('loadBtn');
        const cacheBtn = document.getElementById('cacheBtn');
        const clearCacheBtn = document.getElementById('clearCacheBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');

        // ========================================
        // TELEGRAM API FUNCTIONS
        // ========================================
        
        /**
         * Fetch latest video from Telegram channel
         */
        async function fetchLatestVideo() {
            try {
                showLoading(true);
                hideError();

                // Check if config is set
                if (CONFIG.BOT_TOKEN === 'YOUR_BOT_TOKEN_HERE' || CONFIG.CHANNEL_ID === 'YOUR_CHANNEL_ID_HERE') {
                    throw new Error('Please configure BOT_TOKEN and CHANNEL_ID in the code');
                }

                // Get updates from Telegram
                const updatesUrl = `https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/getUpdates`;
                const response = await fetch(updatesUrl);
                const data = await response.json();

                if (!data.ok) {
                    throw new Error(`Telegram API error: ${data.description}`);
                }

                // Debug: Log the raw response
                console.log('Telegram API response:', data);
                console.log('Number of updates received:', data.result.length);
                console.log('Looking for channel ID:', CONFIG.CHANNEL_ID);

                // Find the latest video message from the channel
                // Note: Channels use 'channel_post' instead of 'message'
                const channelMessages = data.result
                    .filter(update => {
                        // Handle both regular messages and channel posts
                        const post = update.channel_post || update.message;
                        if (!post) return false;
                        
                        // Check if it's from the correct channel
                        if (!post.chat || post.chat.id.toString() !== CONFIG.CHANNEL_ID) {
                            return false;
                        }
                        
                        // Check for video (either as video object or document with video mime type)
                        return post.video || (post.document && post.document.mime_type && post.document.mime_type.startsWith('video/'));
                    })
                    .sort((a, b) => {
                        const postA = a.channel_post || a.message;
                        const postB = b.channel_post || b.message;
                        return postB.date - postA.date;
                    });

                if (channelMessages.length === 0) {
                    // Provide more detailed error message
                    const hasUpdates = data.result.length > 0;
                    if (hasUpdates) {
                        throw new Error('No video found in the channel. The channel may contain other types of content, or the bot may not have permission to read messages.');
                    } else {
                        throw new Error('No updates found. The bot may not be added to the channel, or the channel ID may be incorrect.');
                    }
                }

                const latestUpdate = channelMessages[0];
                const latestMessage = latestUpdate.channel_post || latestUpdate.message;
                
                // Handle both video objects and document objects
                let videoFileId, videoFileName;
                if (latestMessage.video) {
                    videoFileId = latestMessage.video.file_id;
                    videoFileName = latestMessage.video.file_name || 'Video';
                } else if (latestMessage.document) {
                    videoFileId = latestMessage.document.file_id;
                    videoFileName = latestMessage.document.file_name || 'Video';
                } else {
                    throw new Error('No video or document found in message');
                }
                
                currentVideoTitle = videoFileName;
                currentVideoDate = new Date(latestMessage.date * 1000).toLocaleString();

                // Get file path
                const fileUrl = `https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/getFile?file_id=${videoFileId}`;
                const fileResponse = await fetch(fileUrl);
                const fileData = await fileResponse.json();

                if (!fileData.ok) {
                    throw new Error(`Failed to get file path: ${fileData.description}`);
                }

                // Construct direct video URL
                const filePath = fileData.result.file_path;
                currentVideoUrl = `https://api.telegram.org/file/bot${CONFIG.BOT_TOKEN}/${filePath}`;

                // Update UI
                updateVideoPlayer();
                updateInfo();
                updateStatus('online');

            } catch (err) {
                showError(err.message);
                updateStatus('error');
            } finally {
                showLoading(false);
            }
        }

        /**
         * Cache the current video for offline use
         */
        async function cacheVideo() {
            if (!currentVideoUrl) {
                showError('No video loaded to cache');
                return;
            }

            try {
                showLoading(true);
                hideError();

                // Check if service worker is already registered
                if ('serviceWorker' in navigator) {
                    const registration = await navigator.serviceWorker.getRegistration();
                    if (!registration) {
                        // Register service worker if not already registered
                        await navigator.serviceWorker.register('./sw.js', { scope: './' });
                        console.log('Service Worker registered');
                    }
                }

                // Open cache and manually fetch and cache the video
                const cache = await caches.open(CONFIG.CACHE_NAME);
                
                // Manual fetch with CORS mode to handle external Telegram media
                const response = await fetch(currentVideoUrl, { mode: 'cors' });
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch video: ${response.status} ${response.statusText}`);
                }
                
                // Cache the response manually
                await cache.put(currentVideoUrl, response);

                updateStatus('cached');
                alert('Video cached successfully! You can now watch it offline.');

            } catch (err) {
                showError(`Failed to cache video: ${err.message}`);
            } finally {
                showLoading(false);
            }
        }

        /**
         * Clear all cached videos
         */
        async function clearCache() {
            try {
                if ('caches' in window) {
                    await caches.delete(CONFIG.CACHE_NAME);
                    updateStatus('online');
                    alert('Cache cleared successfully');
                    
                    // Optional: Reload page to clear service worker cache
                    if ('serviceWorker' in navigator) {
                        const registration = await navigator.serviceWorker.getRegistration();
                        if (registration) {
                            await registration.update();
                        }
                    }
                }
            } catch (err) {
                showError(`Failed to clear cache: ${err.message}`);
            }
        }

        // ========================================
        // UI UPDATE FUNCTIONS
        // ========================================

        function updateVideoPlayer() {
            videoPlayer.src = currentVideoUrl;
            videoPlayer.load();
        }

        function updateInfo() {
            videoTitle.textContent = currentVideoTitle || 'No video loaded';
            videoDate.textContent = currentVideoDate || '-';
        }

        function updateStatus(status) {
            statusDot.className = 'status-dot';
            
            switch (status) {
                case 'online':
                    statusDot.classList.add('online');
                    statusText.textContent = 'Online - Ready to stream';
                    break;
                case 'cached':
                    statusDot.classList.add('cached');
                    statusText.textContent = 'Video cached - Available offline';
                    break;
                case 'offline':
                    statusText.textContent = 'Offline - Using cached video';
                    break;
                case 'error':
                    statusText.textContent = 'Connection error';
                    break;
                default:
                    statusText.textContent = 'Checking connection...';
            }
        }

        function showLoading(show) {
            loading.classList.toggle('show', show);
            loadBtn.disabled = show;
            cacheBtn.disabled = show;
            clearCacheBtn.disabled = show;
        }

        function showError(message) {
            error.textContent = message;
            error.classList.add('show');
        }

        function hideError() {
            error.classList.remove('show');
        }

        // ========================================
        // ONLINE/OFFLINE DETECTION
        // ========================================

        function updateOnlineStatus() {
            if (navigator.onLine) {
                updateStatus(currentVideoUrl ? 'online' : 'online');
            } else {
                updateStatus('offline');
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // ========================================
        // EVENT LISTENERS
        // ========================================

        loadBtn.addEventListener('click', fetchLatestVideo);
        cacheBtn.addEventListener('click', cacheVideo);
        clearCacheBtn.addEventListener('click', clearCache);

        // ========================================
        // INITIALIZATION
        // ========================================

        // Check online status on load
        updateOnlineStatus();

        // Register service worker on load
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then(registration => {
                        console.log('Service Worker registered:', registration.scope);
                    })
                    .catch(err => {
                        console.error('Service Worker registration failed:', err);
                    });
            });
        }

        // Try to load from cache on startup
        async function loadFromCache() {
            try {
                const cache = await caches.open(CONFIG.CACHE_NAME);
                const cachedResponse = await cache.match(currentVideoUrl);
                if (cachedResponse) {
                    updateStatus('cached');
                }
            } catch (err) {
                console.log('No cached video found');
            }
        }

        // Initial status check
        setTimeout(() => {
            if (navigator.onLine) {
                updateStatus('online');
            } else {
                updateStatus('offline');
            }
        }, 1000);
    </script>
</body>
</html>
